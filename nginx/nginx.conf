server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    # Отдаём статику напрямую
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf|map)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Основная обработка PHP — разрешаем любые .php-файлы
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Всё остальное — через index.php (чтобы роутинг работал)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.ht {
        deny all;
    }
}